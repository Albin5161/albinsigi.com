<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Case Studies Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/fonts.css" />
  <style>
    :root {
      --paper: #ffffff;
      --paper-soft: #f5f5f4;
      --ink: #0b0b0b;
      --gray: #6b6b6b;
      --line: #e4e4e4;
      --danger: #b42318;
      --font: "Satoshi", "Satoshi Fallback", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 56px 16px 80px; }
    h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
    .sub { color: var(--gray); margin: 0 0 32px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="password"] {
      flex: 1 1 240px;
      font: inherit;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper-soft);
    }
    input[type="password"]:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .msg { min-height: 1.5em; margin: 12px 0 0; color: var(--gray); font-size: 0.875rem; }
    .msg.is-error { color: var(--danger); }
    ul { list-style: none; margin: 0 0 24px; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    label {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 4px;
      cursor: pointer;
    }
    .num { color: var(--gray); font-size: 0.875rem; width: 1.5em; flex: none; }
    .title { flex: 1; }
    .state { color: var(--gray); font-size: 0.875rem; width: 3.5em; text-align: right; flex: none; }
    li.is-hidden .title { color: var(--gray); text-decoration: line-through; }
    /* switch */
    .switch { position: relative; width: 44px; height: 26px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span {
      position: absolute; inset: 0;
      border-radius: 999px;
      background: var(--line);
      transition: background 0.2s;
    }
    .switch span::after {
      content: "";
      position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }
    .switch input:checked + span { background: var(--ink); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
    .actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .actions .msg { margin: 0; }
    @media (prefers-reduced-motion: reduce) { .switch span, .switch span::after { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Case studies</h1>
    <p class="sub">Choose which case studies show on the portfolio. Hidden ones stay here, and you can show them again any time.</p>

    <form id="login">
      <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required />
      <button type="submit">Unlock</button>
    </form>
    <p class="msg" id="login-msg" role="status"></p>

    <section id="panel" hidden>
      <ul id="list"></ul>
      <div class="actions">
        <button type="button" id="save" disabled>Save</button>
        <p class="msg" id="save-msg" role="status"></p>
      </div>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById("login");
    const loginMsg = document.getElementById("login-msg");
    const panel = document.getElementById("panel");
    const list = document.getElementById("list");
    const saveBtn = document.getElementById("save");
    const saveMsg = document.getElementById("save-msg");
    let password = "";
    let saved = "";

    function say(el, text, error) {
      el.textContent = text;
      el.classList.toggle("is-error", !!error);
    }

    async function post(body) {
      const r = await fetch("/api/projects", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    function hiddenNow() {
      return [...list.querySelectorAll("input")].filter((i) => !i.checked).map((i) => i.value);
    }

    function refresh() {
      list.querySelectorAll("li").forEach((li) => {
        const on = li.querySelector("input").checked;
        li.classList.toggle("is-hidden", !on);
        li.querySelector(".state").textContent = on ? "Shown" : "Hidden";
      });
      const changed = JSON.stringify(hiddenNow()) !== saved;
      saveBtn.disabled = !changed;
      if (changed) say(saveMsg, "Unsaved changes");
      else if (saveMsg.textContent === "Unsaved changes") say(saveMsg, "");
    }

    function render(projects, hidden) {
      list.innerHTML = "";
      projects.forEach((p, i) => {
        const li = document.createElement("li");
        li.innerHTML =
          '<label><span class="num"></span><span class="title"></span><span class="state"></span>' +
          '<span class="switch"><input type="checkbox" /><span></span></span></label>';
        li.querySelector(".num").textContent = String(i + 1).padStart(2, "0");
        li.querySelector(".title").textContent = p.title;
        const input = li.querySelector("input");
        input.value = p.slug;
        input.checked = !hidden.includes(p.slug);
        input.setAttribute("aria-label", "Show " + p.title);
        input.addEventListener("change", refresh);
        list.appendChild(li);
      });
      saved = JSON.stringify(hiddenNow());
      refresh();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = loginForm.querySelector("button");
      btn.disabled = true;
      say(loginMsg, "Checking…");
      try {
        await post({ password: document.getElementById("password").value });
        password = document.getElementById("password").value;
        const r = await fetch("/api/projects?t=" + Date.now(), { cache: "no-store" });
        const data = await r.json();
        render(data.projects, data.hidden);
        loginForm.hidden = true;
        say(loginMsg, "");
        panel.hidden = false;
      } catch (err) {
        say(loginMsg, err.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      say(saveMsg, "Saving…");
      try {
        const data = await post({ password, hidden: hiddenNow() });
        saved = JSON.stringify(data.hidden);
        say(saveMsg, "Saved. The site updates right away.");
      } catch (err) {
        say(saveMsg, err.message, true);
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
